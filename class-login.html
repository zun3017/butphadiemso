<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/66rKbPmb/trinh-duyet.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị / Giáo viên - Demo Vật Lý</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css?v=1.7.0">
</head>
<body>
    <div class="header">
        <div class="nav-container">
            <a href="index.html" class="nav-left" style="text-decoration: none; cursor: pointer;">
                <img src="https://i.postimg.cc/66rKbPmb/trinh-duyet.png" alt="Logo" class="nav-logo">
                <div class="header-text">
                    <h1>Lớp Vật Lý Thầy Nam</h1>
                    <p>Hệ thống Demo</p>
                </div>
            </a>
            <div class="nav-right">
                <a href="index.html" class="nav-btn" id="btnNavHome"><i class="fa-solid fa-house"></i> Trang chủ</a>
                <a href="parent-login.html" class="nav-btn" id="btnNavParent"><i class="fa-solid fa-graduation-cap"></i> PH/ HS</a>
                <a href="homework.html" class="nav-btn" id="btnNavHomework"><i class="fa-solid fa-file-arrow-up"></i> Bài tập</a>
                <a href="class-login.html" class="nav-btn active" id="btnNavClass"><i class="fa-solid fa-users-rectangle"></i> Giáo viên</a>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div id="sectionClassLogin" class="page-section" style="display: flex; flex-direction: column; align-items: center; text-align: center;">
            <div class="badge">
                <span>🏫</span> CỔNG THÔNG TIN LỚP HỌC (DEMO)
            </div>
            <h1 class="main-title">Quản lý <span class="highlight">Lớp Học Vật Lý</span> 📚</h1>
            <p class="sub-title" style="margin-bottom: 20px;">Đăng nhập để trải nghiệm bảng điều khiển giáo viên, quản lý lớp và chấm điểm.</p>
            
            <div class="search-card" style="max-width: 440px; width: 100%;">
                <div class="search-title">
                    <i class="fa-solid fa-school"></i> Đăng nhập Giáo viên Lớp học
                </div>
                
                <!-- SDT Input -->
                <div class="modal-form-group" style="margin-bottom: 15px; text-align: left;">
                    <label style="display: block; margin-bottom: 8px; color: #A6ADCE; font-size: 13px; font-weight: 500;">Số điện thoại giáo viên</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-phone" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #8E4DFF;"></i>
                        <input type="text" id="classPhone" value="0123456789" placeholder="Nhập số điện thoại giáo viên..." style="width: 100%; padding: 14px 16px 14px 45px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #FFF; font-size: 15px; transition: all 0.3s; outline: none;" onfocus="this.style.borderColor='#8E4DFF'" onblur="this.style.borderColor='rgba(255,255,255,0.08)'">
                    </div>
                </div>
                
                <!-- PIN Input -->
                <div class="modal-form-group" style="margin-bottom: 20px; text-align: left;">
                    <label style="display: block; margin-bottom: 8px; color: #A6ADCE; font-size: 13px; font-weight: 500;">Mã PIN bảo mật</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-key" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #8E4DFF;"></i>
                        <input type="password" id="classPin" value="1234" placeholder="Nhập mã PIN (mặc định 1234)..." maxlength="6" style="width: 100%; padding: 14px 16px 14px 45px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #FFF; font-size: 15px; transition: all 0.3s; outline: none;" onfocus="this.style.borderColor='#8E4DFF'" onblur="this.style.borderColor='rgba(255,255,255,0.08)'">
                    </div>
                </div>
                
                <button class="btn-submit" id="btnClassLogin" onclick="xuLyClassLogin()" style="width: 100%; justify-content: center; height: 50px; border-radius: 12px; font-size: 15px; font-weight: bold; background: linear-gradient(135deg, #8E4DFF 0%, #5B21B6 100%); border: none;">
                    Đăng nhập Lớp Học <i class="fa-solid fa-right-to-bracket" id="btnClassLoginIcon" style="margin-left: 6px;"></i>
                </button>
                
                <!-- Gợi ý tài khoản demo 1 chạm -->
                <div style="margin-top: 18px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1); font-size: 12.5px; color: #94A3B8; text-align: left;">
                    <div style="margin-bottom: 6px; font-weight: 600; color: #CBD5E1;"><i class="fa-solid fa-bolt" style="color:#F59E0B;"></i> Tài khoản Dùng thử nhanh:</div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button type="button" onclick="fillDemoAcc('0123456789', '1234')" style="background: rgba(142,77,255,0.15); border: 1px solid rgba(142,77,255,0.3); color: #C084FC; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;">
                            👨‍🏫 Thầy Nam (0123456789)
                        </button>
                    </div>
                </div>
                
                <p id="classThongBaoLoi" class="error-msg" style="color: #EF4444; font-size: 13.5px; margin-top: 12px; display: none;"></p>
                <p id="classLoadingText" class="loading-text" style="color: #A6ADCE; font-size: 13.5px; margin-top: 12px; display: none;"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải thông tin lớp học...</p>
            </div>
        </div>
    </div>

    <script src="js/demo-data.js"></script>
    <script src="js/api.js"></script>
    <script>
        function fillDemoAcc(phone, pin) {
            document.getElementById("classPhone").value = phone;
            document.getElementById("classPin").value = pin;
        }

        function xuLyClassLogin() {
            var phone = document.getElementById("classPhone").value.trim();
            var pin = document.getElementById("classPin").value.trim();
            var errEl = document.getElementById("classThongBaoLoi");
            var loadingEl = document.getElementById("classLoadingText");

            if (!phone) {
                errEl.innerText = "Vui lòng nhập số điện thoại đăng nhập!";
                errEl.style.display = "block";
                return;
            }

            errEl.style.display = "none";
            loadingEl.style.display = "block";
            var btn = document.getElementById('btnClassLogin');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Đang đăng nhập...'; }

            google.script.run.withSuccessHandler(function(res) {
                loadingEl.style.display = "none";
                if (btn) { btn.disabled = false; btn.innerHTML = 'Đăng nhập Lớp Học <i class="fa-solid fa-right-to-bracket"></i>'; }
                
                if (res && res.error) {
                    errEl.innerText = res.error;
                    errEl.style.display = "block";
                } else if (res && res.success) {
                    sessionStorage.setItem("classTutorData", JSON.stringify(res));
                    sessionStorage.setItem("userTutorData", JSON.stringify(res));
                    sessionStorage.setItem("userPhone", phone);
                    sessionStorage.setItem("userPin", pin);
                    sessionStorage.setItem("userRole", res.role);

                    localStorage.setItem("classTutorData", JSON.stringify(res));
                    localStorage.setItem("userTutorData", JSON.stringify(res));
                    localStorage.setItem("userPhone", phone);
                    localStorage.setItem("userPin", pin);
                    localStorage.setItem("userRole", res.role);
                    
                    if (res.role === "admin") {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "class-dashboard.html";
                    }
                } else {
                    errEl.innerText = "Đăng nhập không thành công. Vui lòng thử lại!";
                    errEl.style.display = "block";
                }
            }).loginClassSystem(phone, pin);
        }
    </script>
</body>
</html>
