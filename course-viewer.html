<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/66rKbPmb/trinh-duyet.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa Học — Lớp Hóa Thầy Minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-main:    #0D0B1A;
            --bg-nav:     #13102B;
            --bg-sidebar: #100D22;
            --bg-card:    #1A1535;
            --bg-hover:   rgba(124, 58, 237, 0.08);
            --bg-active:  rgba(124, 58, 237, 0.15);
            --accent:     #7C3AED;
            --accent-2:   #10B981;
            --accent-3:   #F59E0B;
            --border:     rgba(255,255,255,0.07);
            --text-1:     #F1F5F9;
            --text-2:     #94A3B8;
            --text-3:     #4B5563;
            --sidebar-w:  340px;
        }

        html, body { height: 100%; background: var(--bg-main); color: var(--text-1); font-family: 'Inter', sans-serif; overflow: hidden; }

        /* ===== NAVBAR ===== */
        .cv-nav {
            height: 56px;
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 20px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }
        .cv-nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
        .cv-nav-logo img { width: 28px; height: 28px; border-radius: 6px; }
        .cv-nav-course-name { font-size: 14px; font-weight: 700; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
        .cv-nav-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
        .cv-nav-progress-wrap { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
        .cv-nav-progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; max-width: 320px; }
        .cv-nav-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width 0.4s; }
        .cv-nav-progress-text { font-size: 12.5px; font-weight: 600; color: var(--accent-2); white-space: nowrap; }
        .cv-nav-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .cv-nav-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; text-decoration: none; font-family: 'Inter', sans-serif; }
        .cv-nav-btn:hover { border-color: var(--accent); color: var(--text-1); background: var(--bg-hover); }

        /* ===== BODY LAYOUT ===== */
        .cv-body {
            display: flex;
            height: calc(100vh - 56px);
            margin-top: 56px;
        }

        /* ===== MAIN (left) ===== */
        .cv-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .cv-main::-webkit-scrollbar { width: 5px; }
        .cv-main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 5px; }

        /* Video Player */
        .cv-player-wrap {
            background: #000;
            position: relative;
        }
        .cv-player-wrap iframe {
            display: block;
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
        }
        .cv-player-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-3);
            background: #050410;
        }
        .cv-player-placeholder i { font-size: 64px; }
        .cv-player-placeholder p { font-size: 16px; font-weight: 500; }

        /* Info panel */
        .cv-info {
            padding: 24px 28px 20px;
            border-bottom: 1px solid var(--border);
        }
        .cv-info-title { font-size: 22px; font-weight: 800; color: var(--text-1); line-height: 1.3; margin-bottom: 12px; }
        .cv-info-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
        .cv-tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 13px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
            line-height: 1.4; white-space: nowrap;
        }
        .cv-tag-purple { background: rgba(124,58,237,0.15); color: #A78BFA; border: 1px solid rgba(124,58,237,0.25); }
        .cv-tag-green  { background: rgba(16,185,129,0.12); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.2); }
        .cv-tag-amber  { background: rgba(245,158,11,0.12); color: #FCD34D; border: 1px solid rgba(245,158,11,0.2); }

        /* Info panel actions */
        .cv-info-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .cv-action-btn {
            padding: 9px 18px; border-radius: 10px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.04); color: var(--text-2);
            font-size: 13.5px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.2s; font-family: 'Inter', sans-serif;
        }
        .cv-action-btn:hover { border-color: var(--accent); color: var(--text-1); background: var(--bg-hover); }
        .cv-action-btn.active-watched { background: rgba(16,185,129,0.15); border-color: var(--accent-2); color: var(--accent-2); }
        .cv-action-btn.active-star { background: rgba(245,158,11,0.12); border-color: var(--accent-3); color: var(--accent-3); }
        .cv-action-btn.btn-primary-action { background: linear-gradient(135deg, var(--accent), #5B21B6); color: #FFF; border: none; }
        .cv-action-btn.btn-primary-action:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(124,58,237,0.35); }

        /* Notes section */
        .cv-notes-section { padding: 20px 28px 28px; }
        .cv-notes-label { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
        .cv-notes-textarea {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px 16px; color: var(--text-1);
            font-size: 14px; font-family: 'Inter', sans-serif; resize: vertical;
            min-height: 100px; line-height: 1.6; transition: border-color 0.2s;
        }
        .cv-notes-textarea:focus { outline: none; border-color: var(--accent); }
        .cv-notes-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

        /* ===== SIDEBAR (right) ===== */
        .cv-sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .cv-sidebar-head {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .cv-sidebar-head-title { font-size: 14px; font-weight: 800; color: var(--text-1); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .cv-sidebar-progress-bar { height: 5px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
        .cv-sidebar-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width 0.4s; }
        .cv-sidebar-progress-text { font-size: 12px; color: var(--text-2); }

        .cv-sidebar-body { flex: 1; overflow-y: auto; }
        .cv-sidebar-body::-webkit-scrollbar { width: 4px; }
        .cv-sidebar-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        /* Chapter groups */
        .cv-chapter { border-bottom: 1px solid var(--border); }
        .cv-chapter-head {
            padding: 13px 20px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; background: rgba(255,255,255,0.02);
            transition: background 0.15s; gap: 10px;
        }
        .cv-chapter-head:hover { background: rgba(255,255,255,0.04); }
        .cv-chapter-name { font-size: 12.5px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
        .cv-chapter-meta { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
        .cv-chapter-arrow { font-size: 11px; color: var(--text-3); transition: transform 0.2s; }
        .cv-chapter.open .cv-chapter-arrow { transform: rotate(180deg); }

        /* Lesson items */
        .cv-lessons { display: none; }
        .cv-chapter.open .cv-lessons { display: block; }
        .cv-lesson {
            padding: 12px 20px 12px 20px;
            display: flex; align-items: flex-start; gap: 12px;
            cursor: pointer; transition: background 0.15s;
            border-left: 3px solid transparent;
            position: relative;
        }
        .cv-lesson:hover { background: var(--bg-hover); }
        .cv-lesson.active {
            background: var(--bg-active);
            border-left-color: var(--accent);
        }
        .cv-lesson-icon {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; margin-top: 1px;
        }
        .cv-lesson-icon.watched  { background: rgba(16,185,129,0.2); color: var(--accent-2); }
        .cv-lesson-icon.playing  { background: rgba(124,58,237,0.25); color: #C4B5FD; }
        .cv-lesson-icon.unwatched { background: rgba(255,255,255,0.05); color: var(--text-3); }
        .cv-lesson-content { flex: 1; min-width: 0; }
        .cv-lesson-name { font-size: 13.5px; font-weight: 600; color: var(--text-2); line-height: 1.35; }
        .cv-lesson.active .cv-lesson-name { color: var(--text-1); }
        .cv-lesson-meta { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
        .cv-lesson-star { color: var(--text-3); font-size: 13px; cursor: pointer; padding: 2px; flex-shrink: 0; transition: color 0.15s; }
        .cv-lesson-star.starred { color: var(--accent-3); }
        .cv-lesson-star:hover { color: var(--accent-3); }

        /* ===== LOADING ===== */
        .cv-full-loading {
            position: fixed; inset: 0; background: var(--bg-main);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            z-index: 200;
        }
        .cv-spinner { width: 40px; height: 40px; border: 3px solid rgba(124,58,237,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cv-loading-text { color: var(--text-2); font-size: 15px; font-weight: 500; }

        /* ===== ERROR STATE ===== */
        .cv-error-state {
            position: fixed; inset: 0; background: var(--bg-main);
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            z-index: 200; text-align: center; padding: 20px;
        }
        .cv-error-state.show { display: flex; }
        .cv-error-icon { font-size: 56px; color: #EF4444; }
        .cv-error-msg { font-size: 15px; color: #FCA5A5; max-width: 400px; line-height: 1.6; }
        .cv-error-back { padding: 10px 24px; border-radius: 10px; background: var(--accent); color: #FFF; font-size: 14px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            html, body { overflow: auto; }
            .cv-body { flex-direction: column-reverse; height: auto; overflow: auto; }
            .cv-sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 380px; }
            .cv-main { overflow: visible; }
        }
    </style>
</head>
<body>

    <!-- LOADING -->
    <div class="cv-full-loading" id="fullLoading">
        <div class="cv-spinner"></div>
        <div class="cv-loading-text">Đang tải khóa học của bạn...</div>
    </div>

    <!-- ERROR STATE -->
    <div class="cv-error-state" id="errorState">
        <i class="fa-solid fa-triangle-exclamation cv-error-icon"></i>
        <div class="cv-error-msg" id="errorMsg">Đã có lỗi xảy ra.</div>
        <a href="parent-login.html" class="cv-error-back"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>
    </div>

    <!-- NAVBAR -->
    <nav class="cv-nav" id="cvNav" style="display:none;">
        <a href="index.html" class="cv-nav-logo">
            <img src="https://i.postimg.cc/66rKbPmb/trinh-duyet.png" alt="Logo">
            <span class="cv-nav-course-name" id="navCourseName">Khóa Học</span>
        </a>
        <div class="cv-nav-divider"></div>
        <div class="cv-nav-progress-wrap">
            <div class="cv-nav-progress-bar">
                <div class="cv-nav-progress-fill" id="navProgressFill" style="width:0%"></div>
            </div>
            <span class="cv-nav-progress-text" id="navProgressText">0%</span>
        </div>
        <div class="cv-nav-actions">
            <a href="index.html" class="cv-nav-btn"><i class="fa-solid fa-house"></i> Trang chủ</a>
            <a href="parent-login.html" class="cv-nav-btn"><i class="fa-solid fa-right-from-bracket"></i> Thoát</a>
        </div>
    </nav>

    <!-- BODY -->
    <div class="cv-body" id="cvBody" style="display:none;">

        <!-- MAIN LEFT -->
        <div class="cv-main" id="cvMain">

            <!-- Video Player -->
            <div class="cv-player-wrap" id="playerWrap">
                <div class="cv-player-placeholder">
                    <i class="fa-solid fa-play-circle"></i>
                    <p>Chọn một bài học để bắt đầu</p>
                </div>
                <div class="cv-video-nav" id="videoNav" style="display:none;">
                    <button class="cv-video-nav-btn" id="btnPrev" onclick="playPrev()"><i class="fa-solid fa-backward-step"></i> Bài trước</button>
                    <button class="cv-video-nav-btn" id="btnNext" onclick="playNext()"><i class="fa-solid fa-forward-step"></i> Bài tiếp <i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>

            <!-- Info Panel -->
            <div class="cv-info" id="infoPanel" style="display:none;">
                <div class="cv-info-title" id="infoTitle">—</div>
                <div class="cv-info-tags" id="infoTags"></div>
                <div class="cv-info-actions">
                    <button class="cv-action-btn" id="btnWatched" onclick="markWatched()">
                        <i class="fa-regular fa-circle-check"></i> Đánh dấu đã xem
                    </button>
                    <button class="cv-action-btn" id="btnStar" onclick="toggleStar()">
                        <i class="fa-regular fa-star"></i> Yêu thích
                    </button>
                    <button class="cv-action-btn" id="btnPrevInfo" onclick="playPrev()">
                        <i class="fa-solid fa-backward-step"></i> Bài trước
                    </button>
                    <button class="cv-action-btn" id="btnNextInfo" onclick="playNext()">
                        Bài tiếp <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>
            </div>

            <!-- Notes -->
            <div class="cv-notes-section" id="notesSection" style="display:none;">
                <div class="cv-notes-label"><i class="fa-solid fa-note-sticky" style="color:var(--accent-3);"></i> Ghi chú của bạn</div>
                <textarea class="cv-notes-textarea" id="notesInput" placeholder="Ghi chú cho bài học này... (tự động lưu)" oninput="saveNote()"></textarea>
                <div class="cv-notes-hint" id="notesHint">Ghi chú được lưu tự động trên thiết bị này</div>
            </div>

        </div>

        <!-- SIDEBAR RIGHT -->
        <div class="cv-sidebar" id="cvSidebar">
            <div class="cv-sidebar-head">
                <div class="cv-sidebar-head-title">
                    <i class="fa-solid fa-list-ul" style="color:var(--accent);"></i>
                    Nội dung khóa học
                </div>
                <div class="cv-sidebar-progress-bar">
                    <div class="cv-sidebar-progress-fill" id="sidebarProgressFill" style="width:0%"></div>
                </div>
                <div class="cv-sidebar-progress-text" id="sidebarProgressText">Đã xem 0/0 bài — 0%</div>
            </div>
            <div class="cv-sidebar-body" id="sidebarBody">
                <!-- rendered by JS -->
            </div>
        </div>

    </div>

    <script src="js/demo-data.js"></script>
    <script src="js/api.js?v=1.9.0"></script>
    <script>
    // ==========================================
    // STATE
    // ==========================================
    var courseCode = '';
    var courseVideos = [];        // flat list
    var currentIdx = -1;
    var watchHistory = {};        // { videoId: { watched, starred, note, lastTime } }

    // ==========================================
    // INIT
    // ==========================================
    document.addEventListener('DOMContentLoaded', function() {
        // Đọc mã khóa học từ URL param, sessionStorage hoặc localStorage
        var urlParams = new URLSearchParams(window.location.search);
        var urlCode = urlParams.get('code');
        courseCode = (urlCode ? urlCode.trim().toUpperCase() : '') || sessionStorage.getItem('courseCode') || localStorage.getItem('courseCode') || '';
        
        if (!courseCode) { 
            showError('Không tìm thấy mã khóa học. Vui lòng đăng nhập lại.'); 
            return; 
        }

        // Đồng bộ giữ phiên đăng nhập lâu dài
        sessionStorage.setItem('courseCode', courseCode);
        localStorage.setItem('courseCode', courseCode);

        // Load saved progress
        try {
            var saved = localStorage.getItem('cv_progress_' + courseCode);
            if (saved) watchHistory = JSON.parse(saved);
        } catch(e) { watchHistory = {}; }



        // Fetch course data
        google.script.run
            .withSuccessHandler(function(res) {
                try {
                    if (!res || !res.success) { showError(res ? res.message : 'Lỗi tải dữ liệu'); return; }
                    courseVideos = res.videos || [];

                    document.getElementById('navCourseName').textContent = res.courseName || 'Khóa Học';
                    document.getElementById('fullLoading').style.display = 'none';

                    if (courseVideos.length === 0) {
                        showError('Khóa học này chưa có video nào. Vui lòng liên hệ giáo viên để được hỗ trợ.');
                        return;
                    }

                    document.getElementById('cvNav').style.display = '';
                    document.getElementById('cvBody').style.display = '';
                    
                    // Auto-resume from last accessed video position
                    var startIdx = 0;
                    if (typeof watchHistory._lastVideoIndex === 'number' && watchHistory._lastVideoIndex >= 0 && watchHistory._lastVideoIndex < courseVideos.length) {
                        startIdx = watchHistory._lastVideoIndex;
                    }
                    
                    renderSidebar();
                    updateProgressBar();
                    playVideo(startIdx);
                } catch(err) {
                    showError('Lỗi hiển thị: ' + err.message);
                }
            })
            .withFailureHandler(function(e) { showError('Lỗi kết nối: ' + e); })
            .getCourseVideos(courseCode);
    });

    // ==========================================
    // PLAY VIDEO
    // ==========================================
    function playVideo(idx) {
        if (idx < 0 || idx >= courseVideos.length) return;
        currentIdx = idx;
        var v = courseVideos[idx];

        // AUTO-MARK AS WATCHED & SAVE LAST ACCESSED POSITION
        if (!watchHistory[v.videoId]) watchHistory[v.videoId] = {};
        watchHistory[v.videoId].watched = true;
        watchHistory[v.videoId].lastTime = fmtTime(new Date());
        watchHistory._lastVideoIndex = idx;
        saveProgress();

        // Update player
        var wrap = document.getElementById('playerWrap');
        var vUrl = v.videoUrl || v.driveUrl || '';
        
        if (vUrl && vUrl.includes('physics-demo-video.html')) {
            wrap.innerHTML = '<iframe src="' + vUrl + '" allowfullscreen style="width: 100%; height: 100%; border: none; border-radius: 12px; background: #000;"></iframe>';
        } else if (vUrl && (vUrl.includes('drive.google.com') || (v.fileId && v.fileId.length > 20))) {
            var driveSrc = v.fileId ? ('https://drive.google.com/file/d/' + v.fileId + '/preview') : vUrl;
            wrap.innerHTML = '<iframe src="' + driveSrc + '" allowfullscreen allow="autoplay" title="' + esc(v.name) + '"></iframe>';
        } else {
            // Mặc định nạp video demo HTML5 Vật Lý sống động
            wrap.innerHTML = '<iframe src="physics-demo-video.html?lesson=' + (idx + 1) + '" allowfullscreen style="width: 100%; height: 100%; border: none; border-radius: 12px; background: #000;"></iframe>';
        }

        // Update info panel
        document.getElementById('infoPanel').style.display = '';
        document.getElementById('notesSection').style.display = '';
        document.getElementById('infoTitle').textContent = v.name;

        // Tags (shows auto-watched & last seen timestamp)
        var prog = watchHistory[v.videoId] || {};
        var tags = '';
        tags += '<span class="cv-tag cv-tag-green"><i class="fa-solid fa-circle-check"></i> Đã tự động tính xem (' + (idx + 1) + '/' + courseVideos.length + ')</span>';
        if (prog.lastTime) tags += '<span class="cv-tag cv-tag-purple"><i class="fa-solid fa-clock-rotate-left"></i> Xem lần cuối: ' + esc(prog.lastTime) + '</span>';
        if (v.classLevel) tags += '<span class="cv-tag cv-tag-purple"><i class="fa-solid fa-school"></i> ' + esc(v.classLevel) + '</span>';
        if (v.topic)      tags += '<span class="cv-tag cv-tag-green"><i class="fa-solid fa-book-open"></i> ' + esc(v.topic) + '</span>';
        if (v.lesson)     tags += '<span class="cv-tag cv-tag-amber"><i class="fa-solid fa-bookmark"></i> ' + esc(v.lesson) + '</span>';
        if (v.duration)   tags += '<span class="cv-tag cv-tag-amber"><i class="fa-regular fa-clock"></i> ' + esc(v.duration) + '</span>';
        document.getElementById('infoTags').innerHTML = tags;

        // Buttons state
        refreshActionBtns(prog);

        // Notes
        document.getElementById('notesInput').value = prog.note || '';

        // Sidebar & navbar
        renderSidebar();
        updateProgressBar();

        // Scroll sidebar item into view
        setTimeout(function() {
            var el = document.getElementById('sitem-' + idx);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 80);
    }

    function playPrev() { if (currentIdx > 0) playVideo(currentIdx - 1); }
    function playNext() { if (currentIdx < courseVideos.length - 1) playVideo(currentIdx + 1); }

    // ==========================================
    // ACTIONS
    // ==========================================
    function markWatched() {
        if (currentIdx < 0) return;
        var vid = courseVideos[currentIdx].videoId;
        if (!watchHistory[vid]) watchHistory[vid] = {};
        watchHistory[vid].watched = !watchHistory[vid].watched;
        saveProgress();
        refreshActionBtns(watchHistory[vid]);
        renderSidebar();
        updateProgressBar();
    }

    function toggleStar() {
        if (currentIdx < 0) return;
        var vid = courseVideos[currentIdx].videoId;
        if (!watchHistory[vid]) watchHistory[vid] = {};
        watchHistory[vid].starred = !watchHistory[vid].starred;
        saveProgress();
        refreshActionBtns(watchHistory[vid]);
        renderSidebar();
    }

    var noteSaveTimeout = null;
    function saveNote() {
        if (currentIdx < 0) return;
        var vid = courseVideos[currentIdx].videoId;
        var noteVal = document.getElementById('notesInput').value;
        if (!watchHistory[vid]) watchHistory[vid] = {};
        watchHistory[vid].note = noteVal;
        saveProgress();
        var hint = document.getElementById('notesHint');
        hint.textContent = 'Đã lưu trên thiết bị lúc ' + fmtTime(new Date());

        if (noteSaveTimeout) clearTimeout(noteSaveTimeout);
        noteSaveTimeout = setTimeout(function() {
            google.script.run
                .withSuccessHandler(function(res) {
                    if (res && res.success) {
                        hint.textContent = '☁️ Đã đồng bộ ghi chú lên hệ thống lúc ' + fmtTime(new Date());
                    }
                })
                .saveStudentNote(courseCode, vid, noteVal);
        }, 1200);
    }

    function refreshActionBtns(prog) {
        var btnW = document.getElementById('btnWatched');
        var btnS = document.getElementById('btnStar');
        if (!btnW || !btnS) return;

        if (prog && prog.watched) {
            btnW.className = 'cv-action-btn active-watched';
            btnW.innerHTML = '<i class="fa-solid fa-circle-check"></i> Đã xem ✓';
        } else {
            btnW.className = 'cv-action-btn';
            btnW.innerHTML = '<i class="fa-regular fa-circle-check"></i> Đánh dấu đã xem';
        }

        if (prog && prog.starred) {
            btnS.className = 'cv-action-btn active-star';
            btnS.innerHTML = '<i class="fa-solid fa-star"></i> Đã lưu';
        } else {
            btnS.className = 'cv-action-btn';
            btnS.innerHTML = '<i class="fa-regular fa-star"></i> Yêu thích';
        }

        // Prev/Next
        var hasPrev = currentIdx > 0, hasNext = currentIdx < courseVideos.length - 1;
        var bPrev = document.getElementById('btnPrevInfo');
        var bNext = document.getElementById('btnNextInfo');
        if (bPrev) bPrev.style.display = hasPrev ? '' : 'none';
        if (bNext) {
            bNext.style.display = hasNext ? '' : 'none';
            bNext.className = 'cv-action-btn btn-primary-action';
        }
    }

    // ==========================================
    // SIDEBAR
    // ==========================================
    function renderSidebar() {
        // Group by topic
        var topicOrder = [];
        var topicMap = {};
        courseVideos.forEach(function(v, i) {
            var t = v.topic || 'Bài học';
            if (!topicMap[t]) { topicMap[t] = []; topicOrder.push(t); }
            topicMap[t].push({ v: v, i: i });
        });

        var html = '';
        topicOrder.forEach(function(topic, tIdx) {
            var items = topicMap[topic];
            var doneCount = items.filter(function(x) { return watchHistory[x.v.videoId] && watchHistory[x.v.videoId].watched; }).length;
            var isOpen = items.some(function(x) { return x.i === currentIdx; }) || tIdx === 0;
            html += '<div class="cv-chapter ' + (isOpen ? 'open' : '') + '" onclick="toggleChapter(this)">';
            html += '<div class="cv-chapter-head">';
            html += '<span class="cv-chapter-name">' + esc(topic) + '</span>';
            html += '<span class="cv-chapter-meta">' + doneCount + '/' + items.length + '</span>';
            html += '<i class="fa-solid fa-chevron-down cv-chapter-arrow"></i>';
            html += '</div>';
            html += '<div class="cv-lessons">';
            items.forEach(function(item) {
                var v = item.v, i = item.i;
                var prog = watchHistory[v.videoId] || {};
                var isActive = i === currentIdx;
                var iconClass = isActive ? 'playing' : (prog.watched ? 'watched' : 'unwatched');
                var iconHtml = isActive ? '<i class="fa-solid fa-play"></i>' : (prog.watched ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-regular fa-circle"></i>');
                var starClass = prog.starred ? 'cv-lesson-star starred' : 'cv-lesson-star';
                var activeBadge = isActive ? ' <span style="background:rgba(124,58,237,0.35); color:#DDD6FE; font-size:10.5px; padding:1px 6px; border-radius:4px; font-weight:700; border:1px solid rgba(124,58,237,0.5);">📌 ĐANG XEM</span>' : '';
                html += '<div class="cv-lesson ' + (isActive ? 'active' : '') + '" id="sitem-' + i + '" onclick="playVideo(' + i + ')">';
                html += '<div class="cv-lesson-icon ' + iconClass + '">' + iconHtml + '</div>';
                html += '<div class="cv-lesson-content">';
                html += '<div class="cv-lesson-name">' + esc(v.name) + activeBadge + '</div>';
                html += '<div class="cv-lesson-meta">' + (v.duration || '') + (prog.lastTime ? (v.duration ? ' · ' : '') + 'Lần cuối: ' + prog.lastTime : '') + '</div>';
                html += '</div>';
                html += '<span class="' + starClass + '" onclick="event.stopPropagation(); toggleStarAt(' + i + ')">★</span>';
                html += '</div>';
            });
            html += '</div></div>';
        });

        document.getElementById('sidebarBody').innerHTML = html;
    }

    function toggleChapter(el) {
        // Toggle only if clicking the header, not a lesson
        if (event.target.closest('.cv-lesson')) return;
        el.classList.toggle('open');
    }

    function toggleStarAt(idx) {
        var vid = courseVideos[idx].videoId;
        if (!watchHistory[vid]) watchHistory[vid] = {};
        watchHistory[vid].starred = !watchHistory[vid].starred;
        saveProgress();
        renderSidebar();
        if (idx === currentIdx) refreshActionBtns(watchHistory[vid]);
    }

    // ==========================================
    // PROGRESS
    // ==========================================
    function updateProgressBar() {
        var total = courseVideos.length;
        var done = courseVideos.filter(function(v) { return watchHistory[v.videoId] && watchHistory[v.videoId].watched; }).length;
        var pct = total > 0 ? Math.round(done / total * 100) : 0;
        var pctStr = pct + '%';

        document.getElementById('navProgressFill').style.width = pctStr;
        document.getElementById('navProgressText').textContent = pctStr;
        document.getElementById('sidebarProgressFill').style.width = pctStr;
        document.getElementById('sidebarProgressText').textContent = 'Đã xem ' + done + '/' + total + ' bài — ' + pctStr;
    }

    // ==========================================
    // PERSISTENCE & UTILS
    // ==========================================
    function saveProgress() {
        try { localStorage.setItem('cv_progress_' + courseCode, JSON.stringify(watchHistory)); } catch(e) {}
    }

    function showError(msg) {
        document.getElementById('fullLoading').style.display = 'none';
        document.getElementById('cvNav').style.display = 'none';
        document.getElementById('cvBody').style.display = 'none';
        document.getElementById('errorMsg').textContent = msg;
        document.getElementById('errorState').classList.add('show');
    }

    function fmtTime(d) {
        return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }

    function esc(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    </script>
    <script src="js/screenshot-tool.js"></script>
</body>
</html>
